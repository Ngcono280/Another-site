<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>modern timer · monochrome · growing black hole</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 20% 30%, #1a1a1a, #0a0a0a);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
    }

    #bg-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      display: block;
    }

    .timer-card.void-hidden { opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }

    .timer-card {
      position: relative;
      z-index: 10;
      background: rgba(10, 10, 10, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 3.5rem;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.9),
                  inset 0 1px 1px rgba(255, 255, 255, 0.05);
      transform-origin: center center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .display-wrap { position: relative; text-align: center; margin-bottom: 2rem; }

    .time-display {
      font-size: clamp(3.5rem, 16vw, 5.5rem);
      font-weight: 600;
      letter-spacing: 4px;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.3), 0 0 40px rgba(255, 255, 255, 0.1);
      background: linear-gradient(135deg, #ffffff, #cccccc);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }

    .display-wrap::after {
      content: '';
      position: absolute;
      bottom: -8px; left: 10%;
      width: 80%; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      border-radius: 100%;
    }

    .controls-grid {
      display: flex; flex-wrap: wrap; gap: 0.75rem;
      justify-content: center; margin-bottom: 1.75rem;
    }

    .btn {
      background: rgba(30, 30, 30, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 3rem;
      padding: 0.85rem 1.8rem;
      font-family: 'Inter', sans-serif;
      font-weight: 500; font-size: 1rem;
      color: #dddddd; cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
      display: inline-flex; align-items: center; justify-content: center;
      gap: 0.5rem; letter-spacing: 0.3px;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
      flex: 1 1 auto; min-width: 100px; user-select: none;
    }

    .btn:hover {
      background: rgba(60, 60, 60, 0.9);
      border-color: rgba(255, 255, 255, 0.25);
      color: #ffffff; transform: translateY(-2px);
      box-shadow: 0 10px 20px -8px rgba(255, 255, 255, 0.15);
    }

    .btn:active { transform: translateY(2px); }

    .btn.primary {
      background: linear-gradient(145deg, #333333, #111111);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      box-shadow: 0 8px 18px -6px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
    }

    .btn.primary:hover {
      background: linear-gradient(145deg, #444444, #222222);
      box-shadow: 0 12px 24px -8px rgba(255, 255, 255, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
    }

    .adjust-panel {
      display: flex; flex-wrap: wrap; align-items: center;
      justify-content: center; gap: 0.8rem;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 4rem; padding: 0.9rem 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(8px); margin-top: 0.5rem;
    }

    .adjust-label {
      font-size: 0.9rem; font-weight: 500; color: #888888;
      letter-spacing: 0.3px; text-transform: uppercase; margin-right: 0.25rem;
    }

    .adjust-group {
      display: flex; align-items: center; gap: 0.6rem;
      background: rgba(0, 0, 0, 0.4);
      padding: 0.3rem 0.6rem; border-radius: 3rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .adjust-btn {
      background: transparent; border: none; color: #aaaaaa;
      font-size: 1.5rem; font-weight: 500;
      width: 2.2rem; height: 2.2rem; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.15s; line-height: 1; user-select: none;
    }

    .adjust-btn:hover { background: rgba(255, 255, 255, 0.1); color: #ffffff; transform: scale(1.1); }
    .adjust-btn:active { transform: scale(0.95); }

    .adjust-value {
      font-weight: 600; font-size: 1.4rem; color: #eeeeee;
      min-width: 3.5rem; text-align: center;
      font-variant-numeric: tabular-nums; letter-spacing: 0.5px;
    }

    .unit { font-size: 0.8rem; color: #777777; margin-left: 0.1rem; font-weight: 500; }

    .status-badge {
      display: flex; justify-content: center; align-items: center;
      margin-top: 1.3rem; font-size: 0.8rem; font-weight: 500;
      color: #888888; letter-spacing: 0.5px; text-transform: uppercase;
    }

    .status-badge span {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #555555; margin-right: 0.6rem;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .status-badge.running span { background: #ffffff; box-shadow: 0 0 12px #ffffff; }
    .status-badge.paused span { background: #aaaaaa; box-shadow: 0 0 10px #aaaaaa; }
    .status-badge.finished span { background: #ffffff; box-shadow: 0 0 20px #ffffff, 0 0 30px #ffffff; }

    /* Canvas follows the same exact black/white inversion as the UI. */
    body.light-theme #bg-canvas {
      filter: invert(1);
    }

    /* ---------- Theme switch ---------- */
    .theme-toggle {
      position: fixed;
      left: 24px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 100;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(20, 20, 20, 0.82);
      color: #eeeeee;
      font-family: 'Inter', sans-serif;
      font-size: 1.45rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
      transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
      user-select: none;
    }

    .theme-toggle:hover {
      transform: translateY(-50%) scale(1.08);
      background: rgba(45, 45, 45, 0.92);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .theme-toggle:active {
      transform: translateY(-50%) scale(0.96);
    }

    /* Exact monochrome inversion: original dark palette -> light palette */
    body.light-theme {
      background: radial-gradient(circle at 20% 30%, #e5e5e5, #f5f5f5);
    }

    body.light-theme .timer-card {
      background: rgba(245, 245, 245, 0.82);
      border-color: rgba(0, 0, 0, 0.1);
      box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.18),
                  inset 0 1px 1px rgba(0, 0, 0, 0.05);
    }

    body.light-theme .time-display {
      text-shadow: 0 0 20px rgba(0, 0, 0, 0.3), 0 0 40px rgba(0, 0, 0, 0.1);
      background: linear-gradient(135deg, #000000, #333333);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    body.light-theme .display-wrap::after {
      background: linear-gradient(90deg, transparent, rgba(0, 0, 0, 0.4), transparent);
    }

    body.light-theme .btn {
      background: rgba(225, 225, 225, 0.8);
      border-color: rgba(0, 0, 0, 0.1);
      color: #222222;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.16);
    }

    body.light-theme .btn:hover {
      background: rgba(195, 195, 195, 0.9);
      border-color: rgba(0, 0, 0, 0.25);
      color: #000000;
      box-shadow: 0 10px 20px -8px rgba(0, 0, 0, 0.15);
    }

    body.light-theme .btn.primary {
      background: linear-gradient(145deg, #cccccc, #eeeeee);
      border-color: rgba(0, 0, 0, 0.2);
      color: #000000;
      box-shadow: 0 8px 18px -6px rgba(0, 0, 0, 0.28),
                  0 0 0 1px rgba(0, 0, 0, 0.05) inset;
    }

    body.light-theme .btn.primary:hover {
      background: linear-gradient(145deg, #bbbbbb, #dddddd);
      box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.2),
                  0 0 0 1px rgba(0, 0, 0, 0.1) inset;
    }

    body.light-theme .adjust-panel {
      background: rgba(255, 255, 255, 0.5);
      border-color: rgba(0, 0, 0, 0.05);
    }

    body.light-theme .adjust-label {
      color: #777777;
    }

    body.light-theme .adjust-group {
      background: rgba(255, 255, 255, 0.4);
      border-color: rgba(0, 0, 0, 0.05);
    }

    body.light-theme .adjust-btn {
      color: #555555;
    }

    body.light-theme .adjust-btn:hover {
      background: rgba(0, 0, 0, 0.1);
      color: #000000;
    }

    body.light-theme .adjust-value {
      color: #111111;
    }

    body.light-theme .unit,
    body.light-theme .status-badge {
      color: #888888;
    }

    body.light-theme .status-badge span {
      background: #aaaaaa;
    }

    body.light-theme .status-badge.running span {
      background: #000000;
      box-shadow: 0 0 12px #000000;
    }

    body.light-theme .status-badge.paused span {
      background: #555555;
      box-shadow: 0 0 10px #555555;
    }

    body.light-theme .status-badge.finished span {
      background: #000000;
      box-shadow: 0 0 20px #000000, 0 0 30px #000000;
    }

    body.light-theme .theme-toggle {
      background: rgba(235, 235, 235, 0.88);
      border-color: rgba(0, 0, 0, 0.16);
      color: #111111;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
    }

    body.light-theme .theme-toggle:hover {
      background: rgba(215, 215, 215, 0.94);
      border-color: rgba(0, 0, 0, 0.3);
    }

    @media (max-width: 700px) {
      .theme-toggle {
        left: 12px;
        width: 46px;
        height: 46px;
        font-size: 1.25rem;
      }
    }

    @media (max-width: 480px) {
      .timer-card { padding: 1.8rem 1.2rem; border-radius: 2.5rem; }
      .btn { padding: 0.7rem 1rem; font-size: 0.9rem; min-width: 70px; }
      .adjust-panel { padding: 0.8rem 1rem; gap: 0.5rem; }
      .adjust-value { font-size: 1.2rem; min-width: 2.8rem; }
      .adjust-btn { width: 2rem; height: 2rem; font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <button class="theme-toggle" id="themeToggle" aria-label="Switch theme" title="Switch theme">
    ☼
  </button>

  <div class="timer-card" id="timerCard">
    <div class="display-wrap">
      <div class="time-display" id="timerDisplay">00:00</div>
    </div>

    <div class="controls-grid">
      <button class="btn primary" id="startPauseBtn">▶ Start</button>
      <button class="btn" id="resetBtn">↺ Reset</button>
    </div>

    <div class="adjust-panel">
      <span class="adjust-label">adjust</span>
      <div class="adjust-group">
        <button class="adjust-btn" id="minusMin" aria-label="decrease minutes">−</button>
        <span class="adjust-value" id="minutesValue">0</span>
        <span class="unit">min</span>
        <button class="adjust-btn" id="plusMin" aria-label="increase minutes">+</button>
      </div>
      <div class="adjust-group">
        <button class="adjust-btn" id="minusSec" aria-label="decrease seconds">−</button>
        <span class="adjust-value" id="secondsValue">0</span>
        <span class="unit">sec</span>
        <button class="adjust-btn" id="plusSec" aria-label="increase seconds">+</button>
      </div>
    </div>

    <div class="status-badge" id="statusBadge">
      <span></span> <span id="statusText">ready</span>
    </div>
  </div>

  <script>
    (function() {
      // ---------- DOM ----------
      const display = document.getElementById('timerDisplay');
      const startPauseBtn = document.getElementById('startPauseBtn');
      const resetBtn = document.getElementById('resetBtn');
      const minutesValue = document.getElementById('minutesValue');
      const secondsValue = document.getElementById('secondsValue');
      const minusMin = document.getElementById('minusMin');
      const plusMin = document.getElementById('plusMin');
      const minusSec = document.getElementById('minusSec');
      const plusSec = document.getElementById('plusSec');
      const statusBadge = document.getElementById('statusBadge');
      const statusText = document.getElementById('statusText');
      const cardElement = document.getElementById('timerCard');
      const themeToggle = document.getElementById('themeToggle');

      // ---------- Theme ----------
      let isLightTheme = localStorage.getItem('timerTheme') === 'light';

      function applyTheme() {
        document.body.classList.toggle('light-theme', isLightTheme);
        themeToggle.textContent = isLightTheme ? '☾' : '☼';
        themeToggle.setAttribute(
          'aria-label',
          isLightTheme ? 'Switch to dark theme' : 'Switch to light theme'
        );
        themeToggle.title = isLightTheme ? 'Dark theme' : 'Light theme';
      }

      themeToggle.addEventListener('click', () => {
        playKeySound && playKeySound();
        isLightTheme = !isLightTheme;
        localStorage.setItem('timerTheme', isLightTheme ? 'light' : 'dark');
        applyTheme();
      });

      applyTheme();

      // ---------- Canvas ----------
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');

      let particles = [];
      // States: idle | running | paused | blackhole | singularity | preExplosion | explosion | returning
      let particleState = 'idle';

      const PARTICLE_COUNT = 90;
      const CONNECTION_DIST = 140;

      // Black hole
      let holeRadius = 0;
      let holeOpacity = 0;
      let holeMaxRadius = 0;
      let holeStartRadius = 0;

      // Singularity
      let singularityRadius = 0;
      let singularityOpacity = 0;

      // Explosion
      let explosionRadius = 0;
      let explosionOpacity = 0;

      // Screen shake + warp
      let shakeIntensity = 0;
      let shakeX = 0;
      let shakeY = 0;
      let warpScale = 1;

      // Phase timings — long end-tone -> compression/prelude -> sharp click -> hole.
      const FINISH_PRELUDE = 5.20;
      const HOLE_FLASH = 0.11;
      const HOLE_SNAP = 0.10;
      const HOLE_GROW = 0.28;
      const HOLE_SHAKE = 0.52;
      const HOLE_SUCK_CARD = 0.50;
      const HOLE_HOLD = 1.50;
      const HOLE_COLLAPSE = 0.95;

      const HOLE_FLASH_END = HOLE_FLASH;
      const HOLE_SNAP_END = HOLE_FLASH_END + HOLE_SNAP;
      const HOLE_GROW_END = HOLE_SNAP_END + HOLE_GROW;
      const HOLE_SHAKE_END = HOLE_GROW_END + HOLE_SHAKE;
      const HOLE_SUCK_CARD_END = HOLE_SHAKE_END + HOLE_SUCK_CARD;
      const HOLE_HOLD_END = HOLE_SUCK_CARD_END + HOLE_HOLD;
      const HOLE_COLLAPSE_END = HOLE_HOLD_END + HOLE_COLLAPSE;

      const SINGULARITY_HOLD = 1.6;
      const PRE_EXPLOSION = 1.2;
      const EXPLOSION_DURATION = 0.75;

      // === BOOST: much sharper return ===
      const RETURN_DURATION = 0.55;         // было 2.0 → теперь 0.55
      const CARD_RETURN_DURATION = 0.4;     // было 0.85 → теперь 0.4

      let finishPreludeTimer = 0;
      let holeTimer = 0;
      let singularityTimer = 0;
      let preExplosionTimer = 0;
      let explosionTimer = 0;
      let returnTimer = 0;
      let impactPulse = 0;
      let impactShockRadius = 0;
      let impactFlash = 0;
      let fractureSeed = Math.random() * 1000;
      let fractureFlash = 0;
      let lastCrackStage = 0;
      const CRACK_TIMES = [0.20, 1.90, 3.60];

      let initialTotalSeconds = 0;
      let elapsedSeconds = 0;

      function easeInOutCubic(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }
      function easeInQuad(t) { return t * t; }
      function easeInQuart(t) { return t * t * t * t; }
      function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
      function easeOutExpo(t) { return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); }
      // === Резкий возврат — быстро стартует, плавно оседает ===
      function easeOutQuint(t) { return 1 - Math.pow(1 - t, 5); }
      function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        holeMaxRadius = Math.min(canvas.width, canvas.height) * 0.38;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      function initParticles() {
        particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const x = Math.random() * canvas.width;
          const y = Math.random() * canvas.height;
          particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 0.3,
            vy: (Math.random() - 0.5) * 0.3,
            homeX: x, homeY: y,
            startReturnX: 0, startReturnY: 0,
            startReturnStretch: 0,
            stretch: 0,
            stretchAngle: 0,
            radius: 2 + Math.random() * 2.2,
          });
        }
      }
      initParticles();

      // ---------- Card transform ----------
      function setCardTransform(tx, ty, scaleX, scaleY, rotate, opacity) {
        cardElement.style.transform =
          `translate(${tx}px, ${ty}px) scale(${scaleX}, ${scaleY}) rotate(${rotate}deg)`;
        cardElement.style.opacity = opacity;
        if (opacity < 0.01) {
          cardElement.style.visibility = 'hidden';
        } else {
          cardElement.style.visibility = 'visible';
        }
      }
      function resetCardStyle() {
        cardElement.style.transform = '';
        cardElement.style.opacity = '';
        cardElement.style.visibility = '';
      }

      function setVoidUIHidden(hidden) {
        cardElement.classList.toggle('void-hidden', hidden);
      }

      // ---------- Physics ----------
      function updateParticles(dt) {
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        if (particleState === 'running') {
          elapsedSeconds += dt / 60;
          let progress = 0;
          if (initialTotalSeconds > 0) progress = Math.min(1, elapsedSeconds / initialTotalSeconds);

          // Growing black hole — smooth, with realistic gravitational disturbance near the end.
          const targetHoleRadius = holeMaxRadius * 0.30 * progress;
          const lerpH = Math.min(1, 12 * dt / 60);
          if (targetHoleRadius > holeRadius) {
            holeRadius += (targetHoleRadius - holeRadius) * lerpH;
          }
          holeOpacity = Math.min(1, progress * 3);

          // The closer the timer gets to zero, the stronger the gravitational tremor.
          // It starts almost imperceptibly and builds up instead of suddenly shaking.
          const danger = Math.max(0, (progress - 0.72) / 0.28);
          const dangerEase = danger * danger * danger;
          const pulse = 0.55 + 0.45 * Math.sin(performance.now() * 0.018);
          shakeIntensity = dangerEase * (1.2 + dangerEase * 6.5) * (0.72 + pulse * 0.28);
          shakeX = (Math.random() - 0.5) * shakeIntensity * 2;
          shakeY = (Math.random() - 0.5) * shakeIntensity * 2;

          warpScale = 1 + progress * 0.025 + dangerEase * 0.012;

          for (let p of particles) {
            p.x += p.vx * dt;
            p.y += p.vy * dt;

            const dx = cx - p.x, dy = cy - p.y;
            const dist = Math.max(Math.hypot(dx, dy), 0.001);
            if (holeRadius > 3) {
              const pull = progress * 0.18 * (holeRadius / Math.max(dist, 60));
              p.x += (dx / dist) * pull * dt;
              p.y += (dy / dist) * pull * dt;
            }

            if (p.x < 0) { p.x = 0; p.vx *= -1; }
            else if (p.x > canvas.width) { p.x = canvas.width; p.vx *= -1; }
            if (p.y < 0) { p.y = 0; p.vy *= -1; }
            else if (p.y > canvas.height) { p.y = canvas.height; p.vy *= -1; }

            const refDist = Math.max(holeRadius * 3.5, 160);
            const prox = Math.max(0, 1 - dist / refDist);
            p.stretch = prox * progress * (0.28 + dangerEase * 0.20);
            p.stretchAngle = Math.atan2(p.y - cy, p.x - cx);

            // Tiny chaotic orbital drift near the end, reinforcing the gravitational instability.
            if (dangerEase > 0 && dist < refDist * 1.25) {
              const tangentX = -(p.y - cy) / dist;
              const tangentY = (p.x - cx) / dist;
              const swirl = dangerEase * 0.045 * dt;
              p.vx += tangentX * swirl;
              p.vy += tangentY * swirl;
            }
          }
        } else if (particleState === 'paused') {
          // Frozen
        } else if (particleState === 'finishPrelude') {
          finishPreludeTimer += dt / 60;
          const t = Math.min(finishPreludeTimer / FINISH_PRELUDE, 1);
          let crackStage = 0;
          for (let i = 0; i < CRACK_TIMES.length; i++) {
            if (finishPreludeTimer >= CRACK_TIMES[i]) crackStage = i + 1;
          }
          const currentCrackStart = crackStage > 0 ? CRACK_TIMES[crackStage - 1] : 0;
          const stageProgress = crackStage > 0 ? Math.min(1, (finishPreludeTimer - currentCrackStart) / 0.42) : 0;
          if (crackStage > lastCrackStage) {
            for (let s = lastCrackStage + 1; s <= crackStage; s++) {
              playGlassCrackSound(s);
            }
            lastCrackStage = crackStage;
          }
          const impact = crackStage > 0 ? Math.max(0, Math.sin(stageProgress * Math.PI)) : 0;
          const finalSnap = easeOutExpo(Math.max(0, (t - 0.90) / 0.10));

          // The monitor glass reacts in discrete impacts.
          shakeIntensity =
            0.3 +
            crackStage * 2.2 +
            impact * (2.8 + crackStage * 1.2) +
            finalSnap * 22.0;
          shakeX = (Math.random() - 0.5) * shakeIntensity * 2;
          shakeY = (Math.random() - 0.5) * shakeIntensity * 2;

          // Strong monitor/glass distortion: the UI itself is being pulled by the
          // approaching gravitational field. It flexes more after every crack.
          const crackPulse = Math.max(0, Math.sin(stageProgress * Math.PI));
          const crackStretch = crackStage * 0.022;
          const squeeze = 1 - Math.sin(t * Math.PI) * (0.10 + crackStage * 0.018) - finalSnap * 0.045;
          const stretchX = 1 + Math.sin(t * Math.PI * 2.4) * (0.065 + crackStage * 0.010)
                             + crackStretch + finalSnap * 0.075;
          const stretchY = squeeze - crackStage * 0.010;
          warpScale = 1 + Math.sin(t * Math.PI) * 0.06 + crackStage * 0.012 + finalSnap * 0.045;

          const menuJoltX = shakeX * (0.95 + crackStage * 0.10);
          const menuJoltY = shakeY * (0.95 + crackStage * 0.10);
          const menuRot = Math.sin(t * Math.PI * (2.2 + crackStage * 0.18)) *
                          (2.4 + crackStage * 0.75 + crackPulse * 1.4)
                          + finalSnap * 3.8;

          setCardTransform(
            menuJoltX,
            menuJoltY,
            stretchX,
            stretchY,
            menuRot,
            1
          );

          // Pull/stretches the particle field toward the future singularity.
          for (let p of particles) {
            const dx = cx - p.x, dy = cy - p.y;
            const dist = Math.max(Math.hypot(dx, dy), 0.001);
            const pull = (0.04 + 0.55 * easeInQuad(t) + finalSnap * 4.0) * dt;
            p.x += (dx / dist) * pull;
            p.y += (dy / dist) * pull;

            const radialStretch = Math.min(
              1,
              (0.08 + 0.78 * t + finalSnap * 0.35) *
              (1 - Math.min(dist / (canvas.width * 0.95), 0.86))
            );
            p.stretch = radialStretch;
            p.stretchAngle = Math.atan2(p.y - cy, p.x - cx);
          }

          if (finishPreludeTimer >= FINISH_PRELUDE) {
            holeStartRadius = holeRadius;
            holeTimer = 0;
            impactPulse = 0;
            impactShockRadius = 0;
            impactFlash = 1;
            fractureFlash = 1;
            setVoidUIHidden(true);
            playBlackHoleImpactSound();
            particleState = 'blackhole';
          }
        } else if (particleState === 'blackhole') {
          holeTimer += dt / 60;
          const impactT = Math.min(holeTimer / Math.max(HOLE_SNAP_END, 0.001), 1);
          impactPulse = Math.max(0, Math.sin(impactT * Math.PI));
          impactShockRadius = holeMaxRadius * (0.35 + impactT * 1.65);
          impactFlash = holeTimer < HOLE_FLASH ? (1 - holeTimer / HOLE_FLASH) : 0;
          const keepCardDuringFlash = holeTimer < HOLE_FLASH * 0.72;
          setVoidUIHidden(!keepCardDuringFlash);
          let cardScaleX = 1, cardScaleY = 1, cardRot = 0, cardOp = 1;
          let cardShakeMag = 0;

          if (holeTimer < HOLE_FLASH_END) {
            const t = holeTimer / HOLE_FLASH;
            const flashEase = easeOutExpo(Math.min(t, 1));
            holeRadius = holeStartRadius;
            holeOpacity = 0;
            shakeIntensity = 6 + flashEase * 22;
            cardShakeMag = 2 + flashEase * 12;
            warpScale = 1 + flashEase * 0.035;
          } else if (holeTimer < HOLE_SNAP_END) {
            const t = (holeTimer - HOLE_FLASH_END) / HOLE_SNAP;
            const eased = easeOutExpo(Math.min(t, 1));
            holeRadius = holeMaxRadius * (0.97 + eased * 0.03);
            holeOpacity = 1;
            shakeIntensity = 32 + (1 - eased) * 12;
            cardShakeMag = 20 + (1 - eased) * 10;
            warpScale = 1.07 + (1 - eased) * 0.025;
          } else if (holeTimer < HOLE_GROW_END) {
            holeRadius = holeMaxRadius;
            holeOpacity = 1;
            shakeIntensity = 34;
            cardShakeMag = 26;
            warpScale = 1.09;
          } else if (holeTimer < HOLE_SHAKE_END) {
            const t = (holeTimer - HOLE_GROW_END) / HOLE_SHAKE;
            const pulse = 0.5 + 0.5 * Math.sin(t * Math.PI * 8);
            holeRadius = holeMaxRadius; holeOpacity = 1;
            shakeIntensity = 21 + pulse * 8;
            cardShakeMag = 16 + pulse * 6;
            warpScale = 1.045 + pulse * 0.02;
          } else if (holeTimer < HOLE_SUCK_CARD_END) {
            holeRadius = holeMaxRadius; holeOpacity = 1;
            shakeIntensity = 16; cardShakeMag = 20;
            warpScale = 1.045 + ((holeTimer - HOLE_SHAKE_END) / HOLE_SUCK_CARD) * 0.06;
            const t = (holeTimer - HOLE_SHAKE_END) / HOLE_SUCK_CARD;
            const eased = easeInQuart(t);
            const totalShrink = 1 - eased * 0.97;
            cardScaleX = totalShrink * (1 + eased * 1.6);
            cardScaleY = totalShrink * (1 - eased * 0.55);
            cardRot = eased * 28;
            cardOp = Math.max(0, 1 - eased * 1.2);
          } else if (holeTimer < HOLE_HOLD_END) {
            holeRadius = holeMaxRadius; holeOpacity = 1;
            const t = (holeTimer - HOLE_SUCK_CARD_END) / HOLE_HOLD;
            shakeIntensity = 10 * (1 - t * 0.6);
            cardScaleX = 0.03; cardScaleY = 0.03; cardRot = 30; cardOp = 0;
            warpScale = 1.105 * (1 - t * 0.3);
          } else if (holeTimer < HOLE_COLLAPSE_END) {
            const t = (holeTimer - HOLE_HOLD_END) / HOLE_COLLAPSE;
            const eased = easeInOutCubic(t);
            holeRadius = holeMaxRadius * (1 - eased);
            holeOpacity = 1 - eased;
            shakeIntensity = 8 * (1 - t) * (1 - t);
            cardScaleX = 0.03; cardScaleY = 0.03; cardRot = 30; cardOp = 0;
            warpScale = 1 + 0.03 * (1 - eased);
          }

          const cardShakeX = (Math.random() - 0.5) * cardShakeMag * 2;
          const cardShakeY = (Math.random() - 0.5) * cardShakeMag * 2;
          setCardTransform(cardShakeX, cardShakeY, cardScaleX, cardScaleY, cardRot, cardOp);

          shakeX = (Math.random() - 0.5) * shakeIntensity * 2;
          shakeY = (Math.random() - 0.5) * shakeIntensity * 2;

          for (let p of particles) {
            const dx = p.x - cx, dy = p.y - cy;
            const dist = Math.max(Math.hypot(dx, dy), 0.001);
            if (holeRadius > 5) {
              const ratio = holeRadius / holeMaxRadius;
              const suckPhase = (holeTimer > HOLE_SNAP_END) ? 1.45 : 1.0;
              const targetDist = holeRadius * 0.4;
              if (dist > targetDist) {
                const force = ratio * suckPhase * (2.5 + 2800 / (dist + 60));
                const step = Math.min(force * dt, dist - targetDist);
                if (step > 0) { p.x += (dx / dist) * step; p.y += (dy / dist) * step; }
              }
            }
            const refDist = holeRadius * 3.2;
            const prox = Math.max(0, 1 - dist / refDist);
            const suckAmount = (holeTimer > HOLE_SHAKE_END) ? 1.0 :
                              (holeTimer > HOLE_SNAP_END ? 0.82 : 0.45);
            p.stretch = prox * holeOpacity * suckAmount;
            p.stretchAngle = Math.atan2(dy, dx);
          }

          if (holeTimer >= HOLE_COLLAPSE_END) {
            holeRadius = 0; holeOpacity = 0;
            shakeIntensity = 0; shakeX = 0; shakeY = 0;
            warpScale = 1;
            singularityRadius = 3;
            singularityOpacity = 1;
            singularityTimer = 0;
            particleState = 'singularity';
          }
        } else if (particleState === 'singularity') {
          setVoidUIHidden(true);
          singularityTimer += dt / 60;
          singularityRadius = 3 + Math.sin(singularityTimer * 5) * 0.6;
          singularityOpacity = 1;

          setCardTransform(0, 0, 0.03, 0.03, 30, 0);

          for (let p of particles) {
            const dx = cx - p.x, dy = cy - p.y;
            const dist = Math.max(Math.hypot(dx, dy), 0.001);
            const targetDist = singularityRadius + p.radius * 0.8;
            if (dist > targetDist) {
              const step = Math.min(4 * dt, dist - targetDist);
              p.x += (dx / dist) * step;
              p.y += (dy / dist) * step;
            }
            p.vx = 0; p.vy = 0;
            p.stretch = 0;
          }

          if (singularityTimer >= SINGULARITY_HOLD) {
            preExplosionTimer = 0;
            particleState = 'preExplosion';
          }
        } else if (particleState === 'preExplosion') {
          setVoidUIHidden(true);
          preExplosionTimer += dt / 60;
          const t = Math.min(preExplosionTimer / PRE_EXPLOSION, 1);

          shakeIntensity = 24 * easeInQuad(t);
          shakeX = (Math.random() - 0.5) * shakeIntensity * 2;
          shakeY = (Math.random() - 0.5) * shakeIntensity * 2;

          const jitter = 1.5 * t;
          singularityRadius = 3 + t * 5 + Math.sin(preExplosionTimer * 30) * jitter;
          singularityOpacity = 1;

          setCardTransform(0, 0, 0.03, 0.03, 30, 0);

          for (let p of particles) {
            const dx = cx - p.x, dy = cy - p.y;
            const dist = Math.max(Math.hypot(dx, dy), 0.001);
            const targetDist = singularityRadius + p.radius * 0.8;
            if (dist > targetDist) {
              const step = Math.min(5 * dt, dist - targetDist);
              p.x += (dx / dist) * step;
              p.y += (dy / dist) * step;
            }
            p.x += (Math.random() - 0.5) * t * 2.5;
            p.y += (Math.random() - 0.5) * t * 2.5;
            p.vx = 0; p.vy = 0;
            p.stretch = 0;
          }

          if (preExplosionTimer >= PRE_EXPLOSION) {
            explosionTimer = 0;
            explosionRadius = 10;
            explosionOpacity = 1;
            singularityOpacity = 1;
            particleState = 'explosion';

            for (let p of particles) {
              const dx = p.x - cx, dy = p.y - cy;
              const dist = Math.max(Math.hypot(dx, dy), 0.001);
              const baseAngle = Math.atan2(dy, dx);
              const angle = baseAngle + (Math.random() - 0.5) * 0.4;
              const speed = 30 + Math.random() * 25;
              p.vx = Math.cos(angle) * speed;
              p.vy = Math.sin(angle) * speed;
            }
          }
        } else if (particleState === 'explosion') {
          setVoidUIHidden(true);
          explosionTimer += dt / 60;
          const t = Math.min(explosionTimer / EXPLOSION_DURATION, 1);

          const maxR = Math.hypot(canvas.width, canvas.height) * 0.75;
          explosionRadius = 20 + easeOutExpo(t) * maxR;
          explosionOpacity = 1 - t;

          singularityRadius = 3 + t * 40;
          singularityOpacity = 1 - t;

          shakeIntensity = 24 * Math.pow(1 - t, 1.6);
          shakeX = (Math.random() - 0.5) * shakeIntensity * 2;
          shakeY = (Math.random() - 0.5) * shakeIntensity * 2;

          setCardTransform(0, 0, 0.03, 0.03, 30, 0);

          for (let p of particles) {
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            const drag = Math.pow(0.92, dt);
            p.vx *= drag;
            p.vy *= drag;

            if (p.x < p.radius) { p.x = p.radius; p.vx = Math.abs(p.vx) * 0.2; }
            else if (p.x > canvas.width - p.radius) { p.x = canvas.width - p.radius; p.vx = -Math.abs(p.vx) * 0.2; }
            if (p.y < p.radius) { p.y = p.radius; p.vy = Math.abs(p.vy) * 0.2; }
            else if (p.y > canvas.height - p.radius) { p.y = canvas.height - p.radius; p.vy = -Math.abs(p.vy) * 0.2; }

            p.stretch = 0;
          }

          if (t >= 1) {
            for (let p of particles) {
              p.startReturnX = p.x; p.startReturnY = p.y;
              p.startReturnStretch = 0;
            }
            returnTimer = 0;
            particleState = 'returning';
            explosionOpacity = 0;
            singularityOpacity = 0;
            shakeIntensity = 0; shakeX = 0; shakeY = 0;
          }
        } else if (particleState === 'returning') {
          setVoidUIHidden(false);
          // === РЕЗКИЙ ВОЗВРАТ ===
          returnTimer += dt / 60;

          // Карта всплывает резко
          const cardT = Math.min(returnTimer / CARD_RETURN_DURATION, 1);
          const cardEased = easeOutQuint(cardT);  // Очень резкий старт
          const cardScale = 0.1 + 0.9 * cardEased;
          const cardOp = Math.min(1, cardT * 2.5); // быстро проявляется
          setCardTransform(
            0, 0,
            cardScale,
            cardScale,
            (1 - cardEased) * 15,
            cardOp
          );

          // Частицы резко возвращаются домой
          const t = Math.min(returnTimer / RETURN_DURATION, 1);
          const eased = easeOutQuint(t); // резкий
          for (let p of particles) {
            p.x = p.startReturnX + (p.homeX - p.startReturnX) * eased;
            p.y = p.startReturnY + (p.homeY - p.startReturnY) * eased;
            p.stretch = p.startReturnStretch * (1 - eased);
          }

          if (t >= 1) {
            setVoidUIHidden(false);
            particleState = 'idle';
            resetCardStyle();
            for (let p of particles) {
              p.vx = (Math.random() - 0.5) * 0.3;
              p.vy = (Math.random() - 0.5) * 0.3;
              p.stretch = 0;
            }
          }
        } else {
          // Idle
          for (let p of particles) {
            p.x += p.vx * dt; p.y += p.vy * dt;
            if (p.x < 0) { p.x = 0; p.vx *= -1; }
            else if (p.x > canvas.width) { p.x = canvas.width; p.vx *= -1; }
            if (p.y < 0) { p.y = 0; p.vy *= -1; }
            else if (p.y > canvas.height) { p.y = canvas.height; p.vy *= -1; }
            p.stretch = 0;
          }
        }
      }

      // ---------- Draw ----------
      function drawInflowStreaks() {
        if (holeOpacity <= 0.05 || holeRadius <= 5) return;
        const cx = canvas.width / 2, cy = canvas.height / 2;
        const streakCount = 28;
        const now = performance.now() * 0.001;
        ctx.save();
        for (let i = 0; i < streakCount; i++) {
          const baseAngle = (i / streakCount) * Math.PI * 2;
          const phase = ((now * 0.9) + i * 0.37) % 1;
          const r1 = holeRadius * (0.95 + phase * 2.0);
          const r2 = r1 + holeRadius * (0.08 + phase * 0.28);
          const alpha = holeOpacity * 0.38 * (1 - phase) * (1 - phase);
          const angle = baseAngle + now * (0.10 + 0.06 * (1 - phase));
          const x1 = cx + Math.cos(angle) * r1, y1 = cy + Math.sin(angle) * r1;
          const x2 = cx + Math.cos(angle) * r2, y2 = cy + Math.sin(angle) * r2;
          ctx.beginPath();
          ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
          ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
          ctx.lineWidth = 1 + phase * 0.8;
          ctx.stroke();
        }
        ctx.restore();
      }

      // ---------- BAKED BLACK HOLE ----------
      // The expensive cinematic hole is pre-rendered into small offscreen frames once.
      // During the actual timer transition we only use drawImage(), which keeps the main canvas light.
      const BH_BAKE_SIZE = 800;
      const BH_BAKE_BASE_R = 205;
      const BH_BAKE_FRAMES = 40;
      let bhBakeCanvas = document.createElement('canvas');
      let bhBakeCtx = bhBakeCanvas.getContext('2d');
      bhBakeCanvas.width = BH_BAKE_SIZE;
      bhBakeCanvas.height = BH_BAKE_SIZE;
      let bhFrames = [];
      let bhBakeIndex = 0;
      let bhBakeReady = false;
      let bhBakeStarted = false;

      function clamp01(v) { return Math.max(0, Math.min(1, v)); }

      function bakeBlackHoleFrame(frameIndex) {
        const bctx = bhBakeCtx;
        const cx = BH_BAKE_SIZE / 2, cy = BH_BAKE_SIZE / 2;
        const R = BH_BAKE_BASE_R;
        const holeOpacityLocal = 1;
        const now = frameIndex * (1 / 30) * 2.0;

        bctx.clearRect(0, 0, BH_BAKE_SIZE, BH_BAKE_SIZE);
        bctx.save();

        const shadowR = R * 0.66;
        const diskScaleY = 0.22;
        const tilt = -0.10;
        const innerDisk = shadowR * 1.28;
        const outerDisk = R * 2.05;
        const drift = now * 0.16;

        // Soft gravitational halo.
        const haloR = outerDisk * 1.12;
        const halo = bctx.createRadialGradient(cx, cy, shadowR * 0.85, cx, cy, haloR);
        halo.addColorStop(0, 'rgba(255,255,255,0.095)');
        halo.addColorStop(0.20, 'rgba(255,255,255,0.045)');
        halo.addColorStop(0.48, 'rgba(255,255,255,0.012)');
        halo.addColorStop(1, 'rgba(255,255,255,0)');
        bctx.beginPath();
        bctx.arc(cx, cy, haloR, 0, Math.PI * 2);
        bctx.fillStyle = halo;
        bctx.fill();

        function drawDiskHalf(isBack) {
          bctx.save();
          bctx.translate(cx, cy + R * 0.015);
          bctx.scale(1, diskScaleY);
          bctx.rotate(tilt);

          const layers = 34;
          for (let layer = 0; layer < layers; layer++) {
            const q = layer / (layers - 1);
            const rr = innerDisk * (1 - q) + outerDisk * q;
            const width = Math.max(0.6, R * (0.0048 - q * 0.0013));
            const alphaBase = (0.11 - q * 0.073) * holeOpacityLocal;
            const segments = 22;

            // We keep the original geometry and brightness model, but bake it once.
            for (let s = 0; s < segments; s++) {
              const center = (s / segments) * Math.PI * 2 + drift * (0.22 + q * 0.25) + layer * 0.035;
              const wobble = Math.sin(center * 5.0 + layer * 0.8 + now * 0.7) * 0.055;
              const span = 0.11 + 0.08 * (1 - q);
              const a0 = center - span * 0.5 + wobble;
              const a1 = center + span * 0.5 + wobble;
              const mid = (a0 + a1) * 0.5;
              const upper = Math.max(0, -Math.sin(mid));
              const lower = Math.max(0, Math.sin(mid));
              const sideWeight = isBack ? (0.22 + upper * 1.05) : (0.18 + lower * 1.20);
              const beaming = 0.48 + 0.78 * Math.max(0, -Math.cos(mid - tilt));
              const grain = 0.62 + 0.38 * Math.sin(layer * 3.17 + s * 5.13 + now * 1.8) ** 2;
              const alpha = Math.max(0.003, alphaBase * sideWeight * beaming * grain);

              // Full visual quality is fine here: this happens only during bake.
              bctx.beginPath();
              bctx.arc(0, 0, rr, a0, a1);
              bctx.strokeStyle = `rgba(255,255,255,${alpha})`;
              bctx.lineWidth = width * (0.72 + beaming * 0.50);
              bctx.shadowColor = `rgba(255,255,255,${alpha * 0.78})`;
              bctx.shadowBlur = Math.max(1.5, R * (0.018 - q * 0.009));
              bctx.stroke();
            }
          }
          bctx.restore();
        }

        drawDiskHalf(true);

        // Dark shadow.
        bctx.save();
        bctx.translate(cx, cy - R * 0.015);
        const shadow = bctx.createRadialGradient(-shadowR * 0.18, -shadowR * 0.25, shadowR * 0.10, 0, 0, shadowR * 1.10);
        shadow.addColorStop(0, 'rgba(0,0,0,0.998)');
        shadow.addColorStop(0.78, 'rgba(0,0,0,0.998)');
        shadow.addColorStop(0.93, 'rgba(1,1,1,0.985)');
        shadow.addColorStop(0.985, 'rgba(12,12,12,0.60)');
        shadow.addColorStop(1, 'rgba(20,20,20,0)');
        bctx.beginPath();
        bctx.arc(0, 0, shadowR * 1.12, 0, Math.PI * 2);
        bctx.fillStyle = shadow;
        bctx.fill();
        bctx.restore();

        drawDiskHalf(false);

        // Bright photon ring — same layered look, now baked.
        bctx.save();
        bctx.translate(cx, cy - R * 0.015);
        const ringR = shadowR * 1.085;
        for (let layer = 0; layer < 5; layer++) {
          const rr = ringR + layer * Math.max(1.1, R * 0.012);
          bctx.beginPath();
          for (let i = 0; i <= 180; i++) {
            const a = (i / 180) * Math.PI * 2;
            const irregular = 1
              + Math.sin(a * 7 + now * 1.1) * 0.008
              + Math.sin(a * 13 - now * 0.8) * 0.004;
            const x = Math.cos(a) * rr * irregular;
            const y = Math.sin(a) * rr * irregular;
            if (i === 0) bctx.moveTo(x, y); else bctx.lineTo(x, y);
          }
          const brightSide = 0.30 + 0.58 * (0.5 + 0.5 * Math.max(0, -Math.cos(now * 0.10)));
          const alpha = holeOpacityLocal * (0.15 - layer * 0.022) * (0.8 + brightSide);
          bctx.strokeStyle = `rgba(255,255,255,${Math.max(0.015, alpha)})`;
          bctx.lineWidth = Math.max(0.55, R * (0.0042 - layer * 0.00045));
          bctx.stroke();
        }
        bctx.restore();

        // A couple of soft glow passes, much cheaper than hundreds of shadowBlur calls.
        bctx.save();
        bctx.translate(cx, cy - R * 0.015);
        const glowR = ringR * 1.16;
        const glow = bctx.createRadialGradient(0, 0, ringR * 0.90, 0, 0, glowR);
        glow.addColorStop(0, 'rgba(255,255,255,0)');
        glow.addColorStop(0.20, 'rgba(255,255,255,0.13)');
        glow.addColorStop(0.45, 'rgba(255,255,255,0.05)');
        glow.addColorStop(1, 'rgba(255,255,255,0)');
        bctx.beginPath(); bctx.arc(0, 0, glowR, 0, Math.PI * 2);
        bctx.fillStyle = glow; bctx.fill();
        bctx.restore();

        // Deliberately no blobs/clumps here.
        // The baked object stays a clean, thin accretion disk + lensed photon ring,
        // closer to a real black-hole silhouette instead of a liquid vortex.

        bctx.restore();
      }

      async function storeBakedFrame() {
        try {
          if ('createImageBitmap' in window) {
            const bitmap = await createImageBitmap(bhBakeCanvas);
            bhFrames.push(bitmap);
          } else {
            bhFrames.push(bhBakeCanvas.toDataURL('image/png'));
          }
        } catch (e) {
          bhFrames.push(bhBakeCanvas.toDataURL('image/png'));
        }
      }

      function startBlackHoleBake() {
        if (bhBakeStarted) return;
        bhBakeStarted = true;
        const step = async () => {
          if (bhBakeIndex >= BH_BAKE_FRAMES) {
            bhBakeReady = true;
            return;
          }
          bakeBlackHoleFrame(bhBakeIndex++);
          await storeBakedFrame();
          setTimeout(step, 4);
        };
        setTimeout(step, 500);
      }

      // ---------- SCREEN GLASS FRACTURES ----------
      // The cracks originate from the monitor edges/corners, as if the display glass
      // itself is failing under the black hole's gravitational distortion.
      function drawFractures() {
        if (particleState !== 'finishPrelude') return;

        const w = canvas.width, h = canvas.height;
        const tNow = finishPreludeTimer;
        let stage = 0;
        for (let i = 0; i < CRACK_TIMES.length; i++) {
          if (tNow >= CRACK_TIMES[i]) stage = i + 1;
        }
        if (stage <= 0) return;

        const revealFor = (i) => {
          if (i < stage - 1) return 1;
          return Math.min(1, Math.max(0, (tNow - CRACK_TIMES[i]) / 0.55));
        };

        // The monitor glass breaks from its borders/corners, not from the future
        // black-hole position. Long jagged trunks + many short branches make it
        // read like real laminated display glass.
        const routes = [
          { sx: -18, sy: h * 0.17, ex: w * 0.31, ey: h * 0.28, seed: 21.7, angle: 0.12 },
          { sx: w * 0.84, sy: -18, ex: w * 0.61, ey: h * 0.24, seed: 54.2, angle: -0.34 },
          { sx: w + 18, sy: h * 0.82, ex: w * 0.69, ey: h * 0.58, seed: 87.1, angle: 2.70 }
        ];

        function buildCrack(route, seed, steps) {
          const pts = [];
          const dx = route.ex - route.sx;
          const dy = route.ey - route.sy;
          const len = Math.max(1, Math.hypot(dx, dy));
          const nx = -dy / len, ny = dx / len;
          for (let i = 0; i <= steps; i++) {
            const u = i / steps;
            const x = route.sx + dx * u;
            const y = route.sy + dy * u;
            const wave = Math.sin(seed + i * 2.73) * 0.58 + Math.sin(seed * 0.31 + i * 1.47) * 0.42;
            const amp = (1 - u * 0.55) * Math.min(w, h) * 0.013;
            const kink = (i % 4 === 0 ? Math.sin(seed * 1.7 + i * 5.2) * Math.min(w,h) * 0.004 : 0);
            pts.push([x + nx * wave * amp + nx * kink, y + ny * wave * amp + ny * kink]);
          }
          return pts;
        }

        function drawGlassPath(points, count, alpha, width, light) {
          if (count < 1) return;
          ctx.save();
          ctx.globalCompositeOperation = 'source-over';
          ctx.beginPath();
          for (let i = 0; i <= count; i++) {
            const p = points[i];
            if (i === 0) ctx.moveTo(p[0], p[1]);
            else ctx.lineTo(p[0], p[1]);
          }
          // Dark core of the crack + a thin neutral refraction line.
          ctx.strokeStyle = light
            ? `rgba(218,224,230,${Math.min(0.78, alpha)})`
            : `rgba(22,24,27,${Math.min(0.90, alpha)})`;
          ctx.lineWidth = width;
          ctx.lineJoin = 'round';
          ctx.lineCap = 'round';
          ctx.shadowBlur = 0;
          ctx.stroke();
          ctx.restore();
        }

        routes.forEach((route, i) => {
          const reveal = revealFor(i);
          if (reveal <= 0) return;
          const steps = 34 + i * 7;
          const pts = buildCrack(route, fractureSeed + route.seed, steps);
          const count = Math.max(1, Math.floor(steps * reveal));

          const mainW = i === 0 ? 4.2 : 3.6;
          drawGlassPath(pts, count, 0.96, mainW, false);
          drawGlassPath(pts, count, 0.78, 0.95, true);

          // Numerous branches, always diverging sideways from the main crack.
          const branches = [0.16, 0.29, 0.41, 0.55, 0.68, 0.80, 0.90];
          branches.forEach((ratio, b) => {
            const bi = Math.floor(steps * ratio);
            if (bi >= count - 1) return;
            const p0 = pts[Math.max(0, bi - 1)];
            const p1 = pts[bi];
            const p2 = pts[Math.min(steps, bi + 1)];
            const base = Math.atan2(p2[1] - p0[1], p2[0] - p0[0]);
            const side = b % 2 === 0 ? 1 : -1;
            const turn = side * (0.62 + ((b * 0.19) % 0.42));
            const len = Math.min(w, h) * (0.045 + (b % 3) * 0.018);
            const bend = 0.35 + 0.25 * Math.sin(fractureSeed + b * 2.1);
            const bx = p1[0] + Math.cos(base + turn) * len;
            const by = p1[1] + Math.sin(base + turn) * len;
            const branch = [p1, [
              bx + Math.cos(base + turn + 0.8) * len * bend,
              by + Math.sin(base + turn + 0.8) * len * bend
            ]];
            drawGlassPath(branch, 1, 0.82, 2.2, false);
            drawGlassPath(branch, 1, 0.60, 0.60, true);
          });
        });

        // Tiny detached glass splinters around the most recently formed crack.
        const fresh = revealFor(Math.max(0, stage - 1));
        if (fresh > 0 && fresh < 1) {
          ctx.save();
          ctx.fillStyle = `rgba(220,226,232,${0.13 * Math.sin(fresh * Math.PI)})`;
          const seed = fractureSeed + stage * 13.7;
          for (let i = 0; i < 14; i++) {
            const x = ((Math.sin(seed + i * 2.17) * 0.5 + 0.5) * 0.78 + 0.10) * w;
            const y = ((Math.sin(seed * 0.71 + i * 1.83) * 0.5 + 0.5) * 0.78 + 0.10) * h;
            const sz = 3 + (i % 4) * 2;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + sz, y - sz * 0.45);
            ctx.lineTo(x + sz * 0.35, y + sz * 1.1);
            ctx.closePath();
            ctx.fill();
          }
          ctx.restore();
        }
      }

      function drawCrackAftershock() {
        if (particleState !== 'blackhole') return;
        if (holeTimer > 0.48) return;

        const w = canvas.width, h = canvas.height;
        const p = 1 - Math.min(holeTimer / 0.48, 1);
        const alpha = p * 0.22;
        const cx = w / 2, cy = h / 2;
        const routes = [
          { sx: 0, sy: h * 0.30, ex: cx - w * 0.07, ey: cy - h * 0.06 },
          { sx: w * 0.68, sy: 0, ex: cx + w * 0.03, ey: cy - h * 0.10 },
          { sx: w, sy: h * 0.69, ex: cx + w * 0.08, ey: cy + h * 0.10 }
        ];

        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        for (const route of routes) {
          ctx.beginPath();
          const steps = 14;
          for (let i = 0; i <= steps; i++) {
            const u = i / steps;
            const x = route.sx + (route.ex - route.sx) * u;
            const y = route.sy + (route.ey - route.sy) * u;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
          ctx.lineWidth = 1.0;
          ctx.shadowColor = 'rgba(255,255,255,0.55)';
          ctx.shadowBlur = 6;
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawImpactPrelude() {
        if (particleState !== 'blackhole') return;
        const cx = canvas.width / 2, cy = canvas.height / 2;
        const t = holeTimer;
        if (t < HOLE_FLASH) {
          const p = 1 - t / HOLE_FLASH;
          const intensity = p * p;
          ctx.fillStyle = `rgba(255,255,255,${0.16 + intensity * 0.52})`;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.beginPath();
          ctx.arc(cx, cy, Math.max(40, holeMaxRadius * (0.35 + p * 0.35)), 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(255,255,255,${0.25 + intensity * 0.7})`;
          ctx.lineWidth = 2 + intensity * 7;
          ctx.shadowColor = 'rgba(255,255,255,1)';
          ctx.shadowBlur = 20 + intensity * 60;
          ctx.stroke();
          ctx.shadowBlur = 0;
        }
      }

      function drawImpactAftermath() {
        if (particleState !== 'blackhole') return;
        const cx = canvas.width / 2, cy = canvas.height / 2;
        const now = performance.now() * 0.001;
        const t = holeTimer;

        if (t >= HOLE_FLASH && t < 0.55) {
          const p = clamp01((t - HOLE_FLASH) / 0.40);
          const e = easeOutExpo(p);
          const r = holeMaxRadius * (0.72 + e * 1.35);
          const a = (1 - p) * 0.62;
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(255,255,255,${a})`;
          ctx.lineWidth = 1.5 + (1 - p) * 5;
          ctx.shadowColor = `rgba(255,255,255,${a})`;
          ctx.shadowBlur = 12 + (1 - p) * 28;
          ctx.stroke();
          ctx.shadowBlur = 0;

          ctx.save();
          ctx.translate(cx, cy);
          ctx.scale(1, 0.42);
          ctx.beginPath();
          ctx.arc(0, 0, r * 1.22, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(255,255,255,${a * 0.22})`;
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.restore();
        }

        if (t >= HOLE_SNAP_END && t < 0.65) {
          const flick = Math.max(0, Math.sin((t - HOLE_SNAP_END) * 36)) * 0.055;
          if (flick > 0.001) {
            ctx.fillStyle = `rgba(255,255,255,${flick})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          }
        }

        if (t < 0.9) {
          const p = 1 - Math.min(t / 0.9, 1);
          const g = ctx.createRadialGradient(cx, cy, holeMaxRadius * 0.45, cx, cy, Math.hypot(canvas.width, canvas.height) * 0.62);
          g.addColorStop(0, `rgba(0,0,0,0)`);
          g.addColorStop(0.45, `rgba(0,0,0,${0.04 * p})`);
          g.addColorStop(1, `rgba(0,0,0,${0.22 * p})`);
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        if (t >= HOLE_SNAP_END && t < 0.7) {
          const p = 1 - clamp01((t - HOLE_SNAP_END) / 0.5);
          ctx.save();
          ctx.translate(cx, cy);
          ctx.scale(1, 0.32);
          ctx.rotate(now * 0.25);
          const count = 20;
          for (let i = 0; i < count; i++) {
            const a = (i / count) * Math.PI * 2;
            const r1 = holeMaxRadius * (1.05 + (i % 3) * 0.05);
            const r2 = r1 + holeMaxRadius * 0.18 * p;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
            ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
            ctx.strokeStyle = `rgba(255,255,255,${p * 0.09})`;
            ctx.lineWidth = 1;
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      function drawBlackHoleBaked() {
        if (holeOpacity <= 0.01 || holeRadius <= 1) return;
        const cx = canvas.width / 2, cy = canvas.height / 2;
        const maxScale = holeRadius / BH_BAKE_BASE_R;
        const source = bhFrames.length ? bhFrames[Math.min(bhFrames.length - 1, Math.round((holeRadius / Math.max(holeMaxRadius,1)) * (BH_BAKE_FRAMES - 1)))] : null;

        // If baking is still in progress, draw a minimal temporary fallback rather than
        // forcing the expensive original renderer into the critical transition.
        if (!source) {
          ctx.beginPath();
          ctx.arc(cx, cy, holeRadius * 0.66, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(0,0,0,0.98)';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(cx, cy, holeRadius * 0.72, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(255,255,255,${0.42 * holeOpacity})`;
          ctx.lineWidth = Math.max(1.5, holeRadius * 0.012);
          ctx.stroke();
          return;
        }

        const size = BH_BAKE_SIZE * maxScale;
        ctx.save();
        ctx.globalAlpha = holeOpacity;
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(source, cx - size / 2, cy - size / 2, size, size);
        ctx.restore();
      }

      function drawBlackHoleCinematic() {
        // The expensive cinematic layer is now baked into the black-hole frames.
      }

      function drawBlackHoleRing() {
        // Ring is already part of the baked frames.
      }

      startBlackHoleBake();

      function drawTransitionFlashes() {
        const cx = canvas.width / 2, cy = canvas.height / 2;
        let alpha = 0;
        let radius = 0;
        const now = performance.now() * 0.001;

        if (particleState === 'blackhole' && holeTimer < 0.9) {
          const t = Math.min(holeTimer / 0.9, 1);
          const flash = Math.sin(t * Math.PI);
          alpha = 0.10 * flash;
          radius = holeRadius * (1.4 + flash * 1.2);
        } else if (particleState === 'singularity') {
          const t = Math.min(singularityTimer / 0.7, 1);
          const flash = Math.sin(t * Math.PI);
          alpha = 0.13 * flash;
          radius = 18 + flash * 70;
        } else if (particleState === 'preExplosion') {
          const t = Math.min(preExplosionTimer / PRE_EXPLOSION, 1);
          const pulse = Math.max(0, Math.sin(t * Math.PI * 3.2));
          alpha = 0.035 * pulse;
          radius = 30 + pulse * 110;
        }

        if (alpha <= 0.001) return;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(radius, 1));
        g.addColorStop(0, `rgba(255,255,255,${alpha})`);
        g.addColorStop(0.35, `rgba(255,255,255,${alpha * 0.45})`);
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.beginPath();
        ctx.arc(cx, cy, Math.max(radius, 1), 0, Math.PI * 2);
        ctx.fillStyle = g;
        ctx.fill();

        if (particleState === 'singularity') {
          ctx.beginPath();
          ctx.arc(cx, cy, 14 + Math.sin(now * 7) * 2, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.8})`;
          ctx.lineWidth = 1;
          ctx.shadowColor = `rgba(255,255,255,${alpha})`;
          ctx.shadowBlur = 16;
          ctx.stroke();
          ctx.shadowBlur = 0;
        }
      }

      function drawSingularity() {
        if (singularityOpacity <= 0.01 || singularityRadius <= 0.5) return;
        const cx = canvas.width / 2, cy = canvas.height / 2;
        const now = performance.now() * 0.001;

        // Concentrated relativistic-looking glow.
        const glowR = singularityRadius * 10;
        const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
        glow.addColorStop(0, `rgba(255,255,255,${0.98 * singularityOpacity})`);
        glow.addColorStop(0.08, `rgba(255,255,255,${0.75 * singularityOpacity})`);
        glow.addColorStop(0.22, `rgba(255,255,255,${0.28 * singularityOpacity})`);
        glow.addColorStop(0.48, `rgba(255,255,255,${0.07 * singularityOpacity})`);
        glow.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.beginPath();
        ctx.arc(cx, cy, glowR, 0, Math.PI * 2);
        ctx.fillStyle = glow;
        ctx.fill();

        // Fine energy rings with tiny pulsation.
        for (let i = 1; i <= 5; i++) {
          const pulse = 1 + Math.sin(now * 3.2 + i * 1.35) * 0.035;
          const r = (singularityRadius + i * 4.2) * pulse;
          const op = (0.42 / i) * singularityOpacity;
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(255,255,255,${op})`;
          ctx.lineWidth = i === 1 ? 1.5 : 0.8;
          ctx.shadowColor = `rgba(255,255,255,${op})`;
          ctx.shadowBlur = 5 + i * 2;
          ctx.stroke();
        }
        ctx.shadowBlur = 0;

        // Hot core.
        const coreR = Math.max(1, singularityRadius);
        const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR * 1.35);
        core.addColorStop(0, `rgba(255,255,255,${singularityOpacity})`);
        core.addColorStop(0.42, `rgba(245,245,245,${0.96 * singularityOpacity})`);
        core.addColorStop(0.72, `rgba(190,190,190,${0.45 * singularityOpacity})`);
        core.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.beginPath();
        ctx.arc(cx, cy, coreR * 1.35, 0, Math.PI * 2);
        ctx.fillStyle = core;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(cx, cy, coreR * 0.72, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${singularityOpacity})`;
        ctx.shadowColor = 'rgba(255,255,255,1)';
        ctx.shadowBlur = 32;
        ctx.fill();
        ctx.shadowBlur = 0;

        // Tiny dark center: makes the point feel extremely dense instead of a flat white dot.
        if (singularityRadius > 2) {
          ctx.beginPath();
          ctx.arc(cx, cy, Math.max(0.7, singularityRadius * 0.18), 0, Math.PI * 2);
          ctx.fillStyle = `rgba(20,20,20,${0.88 * singularityOpacity})`;
          ctx.fill();
        }
      }

      function drawExplosion() {
        if (explosionOpacity <= 0.01 || explosionRadius <= 1) return;
        const cx = canvas.width / 2, cy = canvas.height / 2;

        const flash = ctx.createRadialGradient(cx, cy, 0, cx, cy, explosionRadius);
        flash.addColorStop(0, `rgba(255, 255, 255, ${explosionOpacity * 0.9})`);
        flash.addColorStop(0.3, `rgba(255, 255, 255, ${explosionOpacity * 0.5})`);
        flash.addColorStop(0.65, `rgba(255, 255, 255, ${explosionOpacity * 0.15})`);
        flash.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.beginPath(); ctx.arc(cx, cy, explosionRadius, 0, Math.PI * 2);
        ctx.fillStyle = flash; ctx.fill();

        ctx.beginPath(); ctx.arc(cx, cy, explosionRadius * 0.92, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 255, 255, ${explosionOpacity * 0.95})`;
        ctx.lineWidth = 3;
        ctx.shadowColor = 'rgba(255, 255, 255, 1)';
        ctx.shadowBlur = 30;
        ctx.stroke(); ctx.shadowBlur = 0;

        ctx.beginPath(); ctx.arc(cx, cy, explosionRadius * 0.78, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 255, 255, ${explosionOpacity * 0.5})`;
        ctx.lineWidth = 1;
        ctx.stroke();

        const rayCount = 24;
        const now = performance.now() * 0.001;
        for (let i = 0; i < rayCount; i++) {
          const a = (i / rayCount) * Math.PI * 2 + now * 0.3;
          const r1 = explosionRadius * 0.7;
          const r2 = explosionRadius * (0.95 + Math.sin(now * 8 + i) * 0.08);
          const alpha = explosionOpacity * 0.5;
          const x1 = cx + Math.cos(a) * r1, y1 = cy + Math.sin(a) * r1;
          const x2 = cx + Math.cos(a) * r2, y2 = cy + Math.sin(a) * r2;
          const g = ctx.createLinearGradient(x1, y1, x2, y2);
          g.addColorStop(0, `rgba(255, 255, 255, 0)`);
          g.addColorStop(1, `rgba(255, 255, 255, ${alpha})`);
          ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
          ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.stroke();
        }
      }

      function drawParticle(p) {
        const s = p.stretch;
        const isStretched = s > 0.03;
        if (isStretched) {
          const angle = p.stretchAngle;
          const lenFactor = 1 + s * 14;
          const widthFactor = 1 - s * 0.55;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(angle);
          ctx.scale(lenFactor, widthFactor);
          ctx.beginPath(); ctx.arc(0, 0, p.radius * 2.4, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${0.22 * (1 - s * 0.3)})`;
          ctx.fill();
          ctx.beginPath(); ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, 1)`;
          ctx.shadowColor = 'rgba(255, 255, 255, 1)';
          ctx.shadowBlur = 26;
          ctx.fill(); ctx.shadowBlur = 0;
          ctx.restore();
        } else {
          let fillAlpha = 0.9, blur = 18;
          if (particleState === 'idle') { fillAlpha = 0.55; blur = 14; }
          else if (particleState === 'running' || particleState === 'paused') { fillAlpha = 0.9; blur = 18; }
          else if (particleState === 'finishPrelude' || particleState === 'blackhole' || particleState === 'preExplosion' || particleState === 'explosion') { fillAlpha = 1; blur = 22; }
          else { fillAlpha = 1; blur = 26; }

          ctx.beginPath(); ctx.arc(p.x, p.y, p.radius * 2.6, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${fillAlpha * 0.15})`;
          ctx.fill();
          ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${fillAlpha})`;
          ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';
          ctx.shadowBlur = blur;
          ctx.fill(); ctx.shadowBlur = 0;
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const cx = canvas.width / 2, cy = canvas.height / 2;

        ctx.save();
        ctx.translate(shakeX, shakeY);

        if (warpScale !== 1) {
          ctx.translate(cx, cy);
          ctx.scale(warpScale, warpScale);
          ctx.translate(-cx, -cy);
        }

        // End-of-timer compression stage.
        if (particleState === 'finishPrelude') {
          const t = Math.min(finishPreludeTimer / FINISH_PRELUDE, 1);
          const pulse = 0.5 + 0.5 * Math.sin(t * Math.PI * 6.0);
          const centerFlash = Math.max(0, Math.sin(t * Math.PI));
          const edgeDark = 0.12 + t * 0.22;
          ctx.fillStyle = `rgba(0,0,0,${edgeDark})`;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, holeMaxRadius * (1.2 + pulse * 0.45));
          g.addColorStop(0, `rgba(255,255,255,${0.015 + centerFlash * 0.15})`);
          g.addColorStop(0.35, `rgba(255,255,255,${0.01 + centerFlash * 0.06})`);
          g.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.beginPath();
          ctx.arc(cx, cy, holeMaxRadius * (0.7 + t * 0.9), 0, Math.PI * 2);
          ctx.fillStyle = g;
          ctx.fill();
        }

        drawInflowStreaks();

        // Connection lines
        ctx.lineWidth = 1;
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const a = particles[i], b = particles[j];
            if (a.stretch > 0.35 || b.stretch > 0.35) continue;
            const dx = a.x - b.x, dy = a.y - b.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < CONNECTION_DIST) {
              const t = 1 - dist / CONNECTION_DIST;
              let alpha;
              if (particleState === 'idle') alpha = t * 0.14;
              else if (particleState === 'running' || particleState === 'paused') alpha = t * 0.42;
              else if (particleState === 'blackhole') alpha = t * 0.55;
              else alpha = t * 0.7;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
              ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
              ctx.stroke();
            }
          }
        }

        // Particles
        for (let p of particles) drawParticle(p);

        // Effects on top of particles
        drawImpactPrelude();
        drawFractures();
        drawBlackHoleBaked();
        drawCrackAftershock();
        drawBlackHoleCinematic();
        drawBlackHoleRing();
        drawImpactAftermath();
        drawSingularity();
        drawExplosion();

        ctx.restore();
      }

      // ---------- Animation loop ----------
      let lastTime = performance.now();
      let lastParticleState = particleState;

      function checkStateSounds() {
        if (particleState !== lastParticleState) {
          if (particleState === 'finishPrelude') {
            playAccretionAudio();
          } else if (particleState === 'blackhole') {
            stopExternalAudio();
          } else if (particleState === 'singularity') {
            playSingularitySound();
            playPostPointAudio();
          } else if (particleState === 'explosion') {
            playExplosionSound();
            stopExternalAudio();
          } else if (particleState === 'returning' || particleState === 'idle') {
            stopExternalAudio();
          }
          lastParticleState = particleState;
        }
      }

      function animate(now) {
