          accretionAudio.currentTime = 0;
          accretionAudio.volume = 0.88;
          const promise = accretionAudio.play();
          if (promise && promise.catch) promise.catch(() => {});
        } catch (e) {}
      }

      function playPostPointAudio() {
        try {
          postPointAudio.currentTime = 0;
          postPointAudio.volume = 0.92;
          const promise = postPointAudio.play();
          if (promise && promise.catch) promise.catch(() => {});
        } catch (e) {}
      }

      // Soft mechanical keyboard-like UI sounds for the timer controls.
      function playKeySound(kind = 'normal') {
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const filter = audioCtx.createBiquadFilter();
          const freq = kind === 'primary' ? 980 : kind === 'reset' ? 760 : 1180;
          const decay = kind === 'primary' ? 0.075 : 0.055;
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          osc.frequency.exponentialRampToValueAtTime(freq * 0.46, now + decay);
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(3600, now);
          filter.frequency.exponentialRampToValueAtTime(1400, now + decay);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(kind === 'primary' ? 0.055 : 0.038, now + 0.002);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + decay);
          osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + decay + 0.01);

          // Tiny muted click transient gives a tactile key feel without sounding harsh.
          const click = audioCtx.createOscillator();
          const clickGain = audioCtx.createGain();
          click.type = 'square';
          click.frequency.setValueAtTime(1450, now);
          click.frequency.exponentialRampToValueAtTime(520, now + 0.018);
          clickGain.gain.setValueAtTime(0.0001, now);
          clickGain.gain.linearRampToValueAtTime(0.022, now + 0.001);
          clickGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.024);
          click.connect(clickGain); clickGain.connect(audioCtx.destination);
          click.start(now); click.stop(now + 0.03);
        } catch (e) {}
      }

      function playSoftTimerTick() {
        try {
          if (!audioCtx) return;
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(680, now);
          osc.frequency.exponentialRampToValueAtTime(420, now + 0.045);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(0.018, now + 0.001);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.055);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.06);
        } catch (e) {}
      }

      function playFinishSound() {
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const now = audioCtx.currentTime;

          // Longer "timer ended" tone that gradually descends into a heavy vacuum-like pull.
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const filter = audioCtx.createBiquadFilter();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.exponentialRampToValueAtTime(145, now + 0.55);
          osc.frequency.exponentialRampToValueAtTime(58, now + 1.25);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.22, now + 0.06);
          gain.gain.linearRampToValueAtTime(0.14, now + 0.72);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 1.42);
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1700, now);
          filter.frequency.exponentialRampToValueAtTime(280, now + 1.15);
          osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 1.45);

          const sub = audioCtx.createOscillator();
          const subGain = audioCtx.createGain();
          sub.type = 'triangle';
          sub.frequency.setValueAtTime(72, now + 0.18);
          sub.frequency.exponentialRampToValueAtTime(31, now + 1.45);
          subGain.gain.setValueAtTime(0.001, now);
          subGain.gain.linearRampToValueAtTime(0.16, now + 0.28);
          subGain.gain.linearRampToValueAtTime(0.22, now + 0.95);
          subGain.gain.exponentialRampToValueAtTime(0.001, now + 1.6);
          sub.connect(subGain); subGain.connect(audioCtx.destination);
          sub.start(now); sub.stop(now + 1.62);
        } catch (e) {}
      }

      function playBlackHoleImpactSound() {
        try {
          if (!audioCtx) return;
          const now = audioCtx.currentTime;

          const click = audioCtx.createOscillator();
          const clickGain = audioCtx.createGain();
          click.connect(clickGain); clickGain.connect(audioCtx.destination);
          click.type = 'square';
          click.frequency.setValueAtTime(2400, now);
          click.frequency.exponentialRampToValueAtTime(420, now + 0.035);
          clickGain.gain.setValueAtTime(0.001, now);
          clickGain.gain.linearRampToValueAtTime(0.22, now + 0.002);
          clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);
          click.start(now); click.stop(now + 0.08);

          const sub = audioCtx.createOscillator();
          const subGain = audioCtx.createGain();
          sub.connect(subGain); subGain.connect(audioCtx.destination);
          sub.type = 'sine';
          sub.frequency.setValueAtTime(120, now + 0.015);
          sub.frequency.exponentialRampToValueAtTime(38, now + 0.58);
          subGain.gain.setValueAtTime(0.001, now + 0.015);
          subGain.gain.linearRampToValueAtTime(0.32, now + 0.045);
          subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.72);
          sub.start(now + 0.015); sub.stop(now + 0.75);

          const buffer = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * 0.12), audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < data.length; i++) {
            const t = i / data.length;
            data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 5);
          }
          const noise = audioCtx.createBufferSource();
          const filter = audioCtx.createBiquadFilter();
          const noiseGain = audioCtx.createGain();
          noise.buffer = buffer;
          filter.type = 'bandpass';
          filter.frequency.value = 1600;
          filter.Q.value = 0.8;
          noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(audioCtx.destination);
          noiseGain.gain.setValueAtTime(0.12, now);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
          noise.start(now);
        } catch (e) {}
      }

      function playSingularitySound() {
        try {
          if (!audioCtx) return;
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(60, now);
          osc.frequency.linearRampToValueAtTime(80, now + SINGULARITY_HOLD);
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.05, now + 0.3);
          gain.gain.linearRampToValueAtTime(0.05, now + SINGULARITY_HOLD - 0.2);
          gain.gain.exponentialRampToValueAtTime(0.001, now + SINGULARITY_HOLD);
          osc.start(now); osc.stop(now + SINGULARITY_HOLD);
        } catch (e) {}
      }

      function playExplosionSound() {
        try {
          if (!audioCtx) return;
          const now = audioCtx.currentTime;

          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(25, now + 0.9);
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.4, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 1.1);
          osc.start(now); osc.stop(now + 1.1);

          const osc2 = audioCtx.createOscillator();
          const gain2 = audioCtx.createGain();
          osc2.connect(gain2); gain2.connect(audioCtx.destination);
          osc2.type = 'square';
          osc2.frequency.setValueAtTime(2000, now);
          osc2.frequency.exponentialRampToValueAtTime(200, now + 0.4);
          gain2.gain.setValueAtTime(0, now);
          gain2.gain.linearRampToValueAtTime(0.15, now + 0.01);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc2.start(now); osc2.stop(now + 0.5);
        } catch (e) {}
      }

      document.addEventListener('pointerdown', unlockExternalAudio, { once: true });

      // ---------- Timer ----------
      let totalSeconds = 0;
      let timerInterval = null;
      let isRunning = false;

      function updateDisplay() {
        const mins = Math.floor(totalSeconds / 60);
        const secs = totalSeconds % 60;
        display.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
      function updateAdjustUI() {
        minutesValue.textContent = Math.floor(totalSeconds / 60);
        secondsValue.textContent = totalSeconds % 60;
      }
      function updateUIState() {
        if (isRunning) {
          startPauseBtn.innerHTML = '⏸ Pause';
          statusBadge.className = 'status-badge running';
          statusText.textContent = 'running';
        } else {
          startPauseBtn.innerHTML = '▶ Start';
          if (totalSeconds === 0) {
            statusBadge.className = 'status-badge finished';
            statusText.textContent = 'finished';
          } else {
            statusBadge.className = 'status-badge paused';
            statusText.textContent = 'paused';
          }
        }
      }
      function refreshAllUI() {
        updateDisplay(); updateAdjustUI(); updateUIState();
      }
      function stopTimer() {
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        isRunning = false;
      }
      function tick() {
        if (totalSeconds > 0) { totalSeconds--; refreshAllUI(); if (totalSeconds > 0 && totalSeconds <= 10) playSoftTimerTick(); }
        if (totalSeconds === 0) {
          stopTimer();
          refreshAllUI();
          playFinishSound();
          if (particleState === 'running') {
            finishPreludeTimer = 0;
            particleState = 'finishPrelude';
            finishPreludeTimer = 0; impactPulse = 0; impactShockRadius = 0; impactFlash = 0; fractureFlash = 0; fractureSeed = Math.random() * 1000; lastCrackStage = 0;
            playAccretionAudio();
            setVoidUIHidden(false);
          } else {
            for (let p of particles) {
              p.startReturnX = p.x; p.startReturnY = p.y;
              p.startReturnStretch = 0;
            }
            returnTimer = 0;
            particleState = 'returning';
            holeOpacity = 0; holeRadius = 0;
            singularityOpacity = 0; singularityRadius = 0;
            explosionOpacity = 0; explosionRadius = 0;
          }
        }
      }

      function startTimer() {
        unlockExternalAudio();
        if (isRunning) return;
        if (totalSeconds <= 0) return;
        if (timerInterval) clearInterval(timerInterval);
        isRunning = true;
        if (particleState !== 'paused') {
          for (let p of particles) { p.homeX = p.x; p.homeY = p.y; }
          initialTotalSeconds = totalSeconds;
          elapsedSeconds = 0;
          holeRadius = 0; holeOpacity = 0;
          singularityRadius = 0; singularityOpacity = 0;
          explosionRadius = 0; explosionOpacity = 0;
          shakeIntensity = 0; shakeX = 0; shakeY = 0;
          warpScale = 1;
          finishPreludeTimer = 0; impactPulse = 0; impactShockRadius = 0; impactFlash = 0; fractureFlash = 0; fractureSeed = Math.random() * 1000;
          for (let p of particles) {
            if (Math.abs(p.vx) < 0.15 && Math.abs(p.vy) < 0.15) {
              p.vx = (Math.random() - 0.5) * 0.8;
              p.vy = (Math.random() - 0.5) * 0.8;
            }
            p.stretch = 0;
          }
        }
        particleState = 'running';
        setVoidUIHidden(false);
        resetCardStyle();
        timerInterval = setInterval(tick, 1000);
        refreshAllUI();
      }

      function pauseTimer() {
        if (!isRunning) return;
        stopTimer();
        if (particleState === 'running') particleState = 'paused';
        refreshAllUI();
      }

      function beginReturn() {
        for (let p of particles) {
          p.startReturnX = p.x; p.startReturnY = p.y;
          p.startReturnStretch = p.stretch;
        }
        returnTimer = 0;
        particleState = 'returning';
        holeOpacity = 0; holeRadius = 0;
        singularityOpacity = 0; singularityRadius = 0;
        explosionOpacity = 0; explosionRadius = 0;
        shakeIntensity = 0; shakeX = 0; shakeY = 0;
        warpScale = 1;
        finishPreludeTimer = 0; impactPulse = 0; impactShockRadius = 0; impactFlash = 0; fractureFlash = 0; fractureSeed = Math.random() * 1000;
      }

      function resetTimer() {
        stopTimer();
        totalSeconds = 0;
        elapsedSeconds = 0;
        refreshAllUI();
        if (particleState === 'running' || particleState === 'paused' ||
            particleState === 'finishPrelude' || particleState === 'blackhole' ||
            particleState === 'preExplosion' || particleState === 'explosion') {
          beginReturn();
        } else if (particleState === 'returning') {
          // уже возвращается
        } else {
          particleState = 'idle';
          setVoidUIHidden(false);
          holeOpacity = 0; holeRadius = 0;
          singularityOpacity = 0; singularityRadius = 0;
          explosionOpacity = 0; explosionRadius = 0;
          resetCardStyle();
        }
      }

      function addSeconds(sec) {
        const newTotal = totalSeconds + sec;
        if (newTotal < 0) return;
        if (newTotal > 359999) return;
        totalSeconds = newTotal;
        if (isRunning && initialTotalSeconds > 0) {
          initialTotalSeconds = Math.max(1, initialTotalSeconds + sec);
        }
        refreshAllUI();
        if (totalSeconds === 0 && isRunning) {
          stopTimer();
          refreshAllUI();
          playFinishSound();
          finishPreludeTimer = 0;
          particleState = 'finishPrelude';
          finishPreludeTimer = 0; impactPulse = 0; impactShockRadius = 0; impactFlash = 0; fractureFlash = 0; fractureSeed = Math.random() * 1000; lastCrackStage = 0;
          playAccretionAudio();
          setVoidUIHidden(false);
        }
      }

      // ---------- Events ----------
      startPauseBtn.addEventListener('click', () => {
        playKeySound('primary');
        if (isRunning) pauseTimer();
        else { if (totalSeconds === 0) return; startTimer(); }
      });
      resetBtn.addEventListener('click', () => { playKeySound('reset'); resetTimer(); });
      plusMin.addEventListener('click', () => { playKeySound(); addSeconds(60); });
      minusMin.addEventListener('click', () => { playKeySound(); addSeconds(-60); });
      plusSec.addEventListener('click', () => { playKeySound(); addSeconds(1); });
      minusSec.addEventListener('click', () => { playKeySound(); addSeconds(-1); });
      document.querySelectorAll('button').forEach((btn) => {
        btn.addEventListener('mousedown', (e) => e.preventDefault());
      });

      // ---------- Init ----------
      totalSeconds = 300;
      refreshAllUI();
      particleState = 'idle';
      lastParticleState = 'idle';

      window.addEventListener('load', () => {
        resizeCanvas();
        initParticles();
        particleState = 'idle';
        lastParticleState = 'idle';
      });
    })();
  </script>
</body>
</html>
